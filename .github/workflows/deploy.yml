name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. 소스 체크아웃 ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js 세팅 + npm 캐시 ────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # ── 3. 의존성 설치 ──────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. 프로덕션 빌드 ────────────────────────────────────────────────────
      - name: Build
        env:
          VITE_API_BASE_URL: https://koala-art.co.kr
          VITE_OAUTH_KAKAO_URL: https://koala-art.co.kr/oauth2/authorization/kakao
          VITE_OAUTH_NAVER_URL: https://koala-art.co.kr/oauth2/authorization/naver
          VITE_GTM_ID: GTM-KHDT3ZKX
          VITE_TOSS_CLIENT_KEY: ${{ secrets.VITE_TOSS_CLIENT_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # 상품 이미지 CDN — DB에 저장된 S3 직접 주소를 렌더 시점에 이 도메인으로 치환한다.
          # (src/app/lib/imageUrl.ts) 값이 없으면 치환하지 않고 원본 S3 주소를 그대로 쓴다.
          VITE_IMAGE_CDN_BASE: https://d21ujaa1y1qwaz.cloudfront.net
          # 어느 PG 로 결제창을 띄울지. 값이 없거나 TOSS 면 토스가 뜬다.
          # 전환할 때 이 값만 NICEPAY 또는 PAYPLE 로 바꾸면 된다.
          VITE_PG: ${{ vars.VITE_PG || 'NICEPAY' }}
          # 아래 둘은 브라우저에 노출되는 공개 키다(시크릿 키가 아니다).
          # 해당 PG 를 쓸 때만 값이 있으면 된다.
          #
          # 여기 적힌 나이스 키는 테스트(샌드박스) 상점 키다. 운영 키를 받으면
          # 저장소 Variables 에 넣어라 — 그 값이 있으면 아래 기본값을 덮는다.
          VITE_NICEPAY_CLIENT_ID: ${{ vars.VITE_NICEPAY_CLIENT_ID || 'S2_70b3ebcd8c3a440d81a4ccf4cb91b434' }}
          VITE_PAYPLE_CLIENT_KEY: ${{ vars.VITE_PAYPLE_CLIENT_KEY }}
        run: npm run build

      # ── 5. AWS 인증 ─────────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── 6. S3 배포 ──────────────────────────────────────────────────────────
      # JS/CSS/폰트 등 해시 파일: 1년 장기 캐시
      # index.html + .json: 캐시 없음 (항상 최신 버전 보장)
      - name: Deploy to S3
        run: |
          # 해시 포함 정적 자산 (1년 캐시)
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html" \
            --exclude "*.json" \
            --exclude "*.txt"

          # HTML / JSON / txt (캐시 없음)
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET }} \
            --cache-control "no-cache,no-store,must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --include "*.txt"

      # ── 7. CloudFront 캐시 무효화 ───────────────────────────────────────────
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
